<text x="459" y="318" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#f0f8f7" text-anchor="start">Review mint</text>
<text x="459" y="359" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">BSV-21 report pass</text>
<text x="459" y="391" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Wallet signs</text>
<text x="459" y="423" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Register signed offer</text>
<rect x="835" y="275" width="300" height="170" rx="10" fill="#101c1e" stroke="#304043" stroke-width="2"/><path d="M837 295V425" stroke="#32d5c3" stroke-width="5"/>
<text x="859" y="318" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#f0f8f7" text-anchor="start">Token overlay</text>
<text x="859" y="359" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Admit + lookup</text>
<text x="859" y="391" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Track live outputs</text>
<text x="859" y="423" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Verify offer binding</text>
