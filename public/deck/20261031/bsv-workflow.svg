<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">BSV: trade access to published reports</title><desc id="desc">Implemented BSV workflow: a separately approved published report is bound by digest to an issuer-minted BSV-21 pass. The overlay tracks token outputs, an independent buyer accepts an atomic BSV swap, and a signed holder challenge unlocks the report. Overlay and issuer are configured; real mint, swap and payment remain unperformed. The separate BRC-121 merchant route needs setup.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#32d5c3"/></marker></defs><rect width="1600" height="900" fill="#060c0d"/>
<text x="55" y="75" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="600" fill="#f0f8f7" text-anchor="start">BSV: trade access to published reports</text>
<text x="55" y="123" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#9aaead" text-anchor="start">Two wallet owners review the terms; the overlay validates tokens and current ownership.</text>
<text x="55" y="215" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#9aaead" text-anchor="start">EXPLICIT PUBLICATION</text>
<text x="440" y="215" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#9aaead" text-anchor="start">ISSUER WALLET</text>
<text x="840" y="215" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#9aaead" text-anchor="start">PRIVATE SERVICE</text>
<text x="1240" y="215" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#9aaead" text-anchor="start">BUYER WALLET</text>
<rect x="55" y="275" width="285" height="170" rx="10" fill="#101c1e" stroke="#304043" stroke-width="2"/><path d="M57 295V425" stroke="#32d5c3" stroke-width="5"/>
<text x="79" y="318" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#f0f8f7" text-anchor="start">Public report</text>
<text x="79" y="359" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Owner approves</text>
<text x="79" y="391" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Backend snapshot</text>
<text x="79" y="423" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Digest binds content</text>
