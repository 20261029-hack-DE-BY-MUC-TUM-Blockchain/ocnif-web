<text x="859" y="618" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#f0f8f7" text-anchor="start">Prove ownership → read report</text>
<text x="859" y="659" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Signed holder challenge + current overlay output</text>
<text x="859" y="691" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Return the published report; check its digest</text>
<polyline points="1390,445 1390,575" fill="none" stroke="#32d5c3" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="55" y="575" width="680" height="145" rx="10" fill="#101c1e" stroke="#304043" stroke-width="2"/><path d="M57 595V700" stroke="#e8c489" stroke-width="5"/>
<text x="79" y="618" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#f0f8f7" text-anchor="start">Alternative: direct BRC-121 payment</text>
<text x="79" y="659" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Wallet-reviewed report purchase</text>
<text x="79" y="691" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#9aaead" text-anchor="start">Merchant setup required</text>
<path d="M55 795H1545" stroke="#304043" stroke-width="2"/>
<text x="55" y="833" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" fill="#f0f8f7" text-anchor="start">Live: overlay + issuer configuration. No real mint, swap or report payment is proven.</text>
<text x="55" y="871" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#9aaead" text-anchor="start">Wallet signing is manual. These BSV transactions are independent of Cardano and API3.</text>
</svg>
