<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Ocnif service architecture</title><desc id="desc">Architecture of the user browser and wallets, public Next.js web and private Azure backend, database, Rust core, diarization, OpenClaw and separate blockchain adapters. The Cardano native worker and MPS remain outside Azure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#32d5c3"/></marker></defs><rect width="1600" height="900" fill="#060c0d"/>
