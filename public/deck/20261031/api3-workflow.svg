<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">API3: signed vulnerability evidence</title><desc id="desc">Implemented API3 flow: user reviews an x402 challenge and signs in MetaMask on Base Sepolia. Backend forwards only the payment proof to the API3 adapter, which verifies the NVD Airnode response. The user separately deploys or submits evidence to VulnerabilityGate. Only the 402 challenge is observed; paid response and on-chain gate execution remain unproven.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#32d5c3"/></marker></defs><rect width="1600" height="900" fill="#060c0d"/>
