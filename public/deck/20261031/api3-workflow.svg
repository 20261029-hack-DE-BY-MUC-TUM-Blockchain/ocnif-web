<text x="55" y="833" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" fill="#f0f8f7" text-anchor="start">Observed: real HTTP 402 challenge. Paid evidence and gate transaction remain open.</text>
<text x="55" y="871" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#9aaead" text-anchor="start">The contract does not automatically stop or release Ocnif jobs. No cross-chain transaction is implied.</text>
